[project]
name = "gridiron"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cgleber", email = "cgleber@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "requests>=2.34.2",
]

[project.scripts]
gridiron = "gridiron:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
